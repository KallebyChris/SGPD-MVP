<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Acesso · SGPD</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="auth-page"><main class="auth-card">
  <p class="eyebrow">SGPD · Gestão de Pessoas</p><h1>Acesse o sistema</h1><p>Entre com sua conta autorizada de RH.</p>
  <div class="notice error" role="alert" th:if="${param.error}">E-mail ou senha inválidos. Confira os dados e tente novamente.</div>
  <div class="notice success" role="status" th:if="${param.logout}">Você saiu do sistema.</div>
  <form th:action="@{/login}" method="post">
    <label for="username">E-mail</label><input id="username" name="username" type="email" autocomplete="username" required>
    <label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="button primary full" type="submit">Entrar</button>
  </form><p class="muted">Acesso restrito aos profissionais autorizados de RH.</p>
</main></body></html>
